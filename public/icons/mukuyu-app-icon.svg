<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="icon-title">
  <title id="icon-title">Mukuyu Junior School — MKJ — Powered by IAN TECH</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#69c9e4"/>
      <stop offset=".48" stop-color="#8875c7"/>
      <stop offset="1" stop-color="#d985bd"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dffcff"/>
      <stop offset=".52" stop-color="#f3d9ff"/>
      <stop offset="1" stop-color="#ffdcbd"/>
    </linearGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffe888"/>
      <stop offset=".46" stop-color="#78f0df"/>
      <stop offset="1" stop-color="#ffd0ef"/>
    </linearGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff39b"/>
      <stop offset="1" stop-color="#ffd36e"/>
    </linearGradient>
    <filter id="tile-shadow" x="-.15" y="-.15" width="1.3" height="1.35" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="13" flood-color="#26334f" flood-opacity=".23"/>
    </filter>
    <filter id="letter-shadow" x="-.12" y="-.12" width="1.24" height="1.28" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#202947" flood-opacity=".42"/>
    </filter>
  </defs>
  <g filter="url(#tile-shadow)">
    <rect x="17" y="17" width="478" height="478" rx="112" fill="url(#tile)" stroke="url(#frame)" stroke-width="6"/>
    <rect x="29" y="29" width="454" height="454" rx="101" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
    <rect x="39" y="39" width="434" height="434" rx="93" fill="none" stroke="#e9ddff" stroke-opacity=".27" stroke-width="2"/>
  </g>
  <g fill="#fff" fill-opacity=".48">
    <circle cx="70" cy="169" r="5"/><circle cx="439" cy="174" r="6"/>
    <circle cx="77" cy="394" r="4"/><circle cx="431" cy="393" r="5"/>
    <circle cx="112" cy="93" r="3"/><circle cx="398" cy="95" r="3"/>
  </g>
  <text x="256" y="121" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="800" letter-spacing="2.2" fill="#f5ffff">MUKUYU JUNIOR SCHOOL</text>
  <text x="256" y="291" text-anchor="middle" textLength="325" lengthAdjust="spacingAndGlyphs" font-family="Arial, Liberation Sans, sans-serif" font-size="151" font-weight="900" letter-spacing="-2" fill="url(#letters)" stroke="#34405d" stroke-width="9" stroke-linejoin="round" paint-order="stroke" filter="url(#letter-shadow)">MKJ</text>
  <path d="M111 337h290" fill="none" stroke="url(#underline)" stroke-width="8" stroke-linecap="round"/>
  <rect x="76" y="368" width="360" height="93" rx="23" fill="#36466c" fill-opacity=".82" stroke="#adfff1" stroke-opacity=".92" stroke-width="3"/>
  <text x="256" y="404" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="800" letter-spacing="2.5" fill="#a8f7f0">POWERED BY</text>
  <text x="256" y="441" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="31" font-weight="900" letter-spacing="1.5" fill="#ffe58a">IAN TECH</text>
